[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tissueresolve"
version = "0.1.0"
description = "Unified cell-type deconvolution for bulk RNA-seq and 10x Visium spatial transcriptomics"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
keywords = [
    "bioinformatics",
    "deconvolution",
    "transcriptomics",
    "single-cell",
    "spatial-transcriptomics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "anndata>=0.10",
    "click>=8.1",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "tqdm>=4.65",
]

[project.optional-dependencies]
spatial = [
    "scanpy>=1.9",
    "scikit-learn>=1.3",
]
report = [
    "jinja2>=3.1",
]
plots = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
all = [
    "tissueresolve[spatial,report,plots,dev]",
]

[project.scripts]
tissueresolve = "tissueresolve.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tissueresolve = ["data/gene_lists/*.tsv", "data/gene_lists/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/tissueresolve"]
omit = ["tests/*"]
